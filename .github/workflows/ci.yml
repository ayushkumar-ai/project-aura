name: AURA CI Pipeline

on:
  push:
    branches: [ main, master, antigravity-work ]
  pull_request:
    branches: [ main, master, antigravity-work ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Runtime & Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Verify Package Imports
        run: |
          python -c "import aura; import app.aura; import app.server; print('Package import successful.')"

      - name: Run Focused Deployment Tests
        run: |
          pytest tests/unit/test_deployment_readiness.py tests/integration/test_deployment_smoke.py

      - name: Run Complete Test Suite
        run: |
          pytest tests/
